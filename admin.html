  /* ============================================================

       3. Auth
       4. Layout (sidebar, topbar)
       5. Views (overview, submissions, settings)
       6. Detail / edit modal + PDF export
       7. Main app
     ============================================================ */

  const { useState, useEffect, useRef, useMemo } = React;
  const html = htm.bind(React.createElement);

  /* ---------- 1. Configuration ---------- */

  const ADMIN_PIN = "1122"; // change here to rotate the PIN

  const SHEET_HEADERS = [

  const TALUKA_SHEETS = {
    "Daur":       "Responses_Daur",

  };

  const TALUKA_META = {
    "Daur":       { accent: "#2563EB", short: "DR" },

  const FORM_SECTIONS = [
    { title: "Personal Identity", fields: [
      ["Email Address", "Email"], ["Full Name", "Full Name"], ["Father's Name", "Father's Name"],

    ]},
    { title: "Location & Posting", fields: [

    { title: "Remarks", fields: [["Remarks", "Remarks"]] }
  ];

  /* ---------- 2. Helpers ---------- */

  const todayISO = () => new Date().toISOString().split("T")[0];

  function formatCNIC(raw) {
    const d = String(raw).replace(/\D/g, "").slice(0, 13);
    if (d.length <= 5) return d;
    if (d.length <= 12) return `${d.slice(0, 5)}-${d.slice(5)}`;
    return `${d.slice(0, 5)}-${d.slice(5, 12)}-${d.slice(12)}`;
  }
  function formatPhone(raw) {
    const d = String(raw).replace(/\D/g, "").slice(0, 11);
    if (d.length <= 4) return d;
    return `${d.slice(0, 4)}-${d.slice(4)}`;
  }
  function initialsFrom(name) {
    if (!name || !name.trim()) return "—";
    const parts = name.trim().split(/\s+/);
    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
    return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
  }

  function rowToForm(row) {
    return {
      email: row["Email Address"] || "",
      fullName: row["Full Name"] || "",
      fatherName: row["Father's Name"] || "",

      cader: row["Cader"] || "",
      desigInitial: row["Designation Initial"] || "",
      desigInitialManual: row["Designation Initial Manual"] || "",
      bpsInitial: row["BPS Initial"] || "",
      desigCurrent: row["Designation Current"] || "",
      desigCurrentManual: row["Designation Current Manual"] || "",
      bpsCurrent: row["BPS Current"] || "",
      doa: row["Date of Appointment"] || "",

      academicManual: row["Academic Qualification Manual"] || "",
      professional: row["Professional Qualification"] || "",

      bedResult: row["Date of B.Ed Result Declaration"] || "",
      steda: row["STEDA Teaching Licence"] || "",
      remarks: row["Remarks"] || ""
    };
  }

  function buildPayload(form) {
    return {
      "Email Address": form.email,
      "Full Name": form.fullName,
      "Father's Name": form.fatherName,
      "Gender": form.gender,
      "Mobile Number": form.mobile,
      "WhatsApp Number": form.whatsapp,
      "CNIC Number": form.cnic,
      "PID / Employee ID No.": form.pid,
      "District": form.district,

  /* Escapes HTML for safe insertion into the PDF window. */
  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, m => ({

        return `<tr><td class="lbl">${esc(label)}</td><td class="val">${display}</td></tr>`;
      }).join("");
      return `<section class="sec"><h2>${esc(title)}</h2><table>${rows}</table></section>`;

  /* ---------- 3. Auth ---------- */

  function useSession() {
    const [secret, setSecret] = useState("");
    const [authed, setAuthed] = useState(false);

    useEffect(() => {
      try {
        const saved = sessionStorage.getItem("sba_admin_secret");
        if (saved) {
          setSecret(saved);
          setAuthed(true);
        }
      } catch {}
    }, []);

    const login = (s) => {
      try { sessionStorage.setItem("sba_admin_secret", s); } catch {}
      setSecret(s);
      setAuthed(true);
    };
    const logout = () => {
      try { sessionStorage.removeItem("sba_admin_secret"); } catch {}
      setSecret("");
      setAuthed(false);
    };

    return { secret, authed, login, logout };
  }

  function LoginScreen({ scriptUrl, setScriptUrl, onLogin, error, setError }) {
    const [pin, setPin] = useState("");
    const [localSecret, setLocalSecret] = useState("");
    const [busy, setBusy] = useState(false);

    useEffect(() => { if (pinRef.current) pinRef.current.focus(); }, []);

    const submit = async () => {
      setError("");

      if (!scriptUrl) { setError("Please enter the Web App URL first."); return; }
      if (!localSecret) { setError("Please enter the SETUP_SECRET."); return; }

      setBusy(true);
      try {
        const res = await fetch(scriptUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "verify", key: localSecret })
        });
        const data = await res.json();
        if (!data.ok) throw new Error("Invalid SETUP_SECRET.");
        try { localStorage.setItem("sba_script_url", scriptUrl); } catch {}
        onLogin(localSecret);
      } catch (err) {
        setError(err.message || "Could not verify credentials.");
      } finally {
        setBusy(false);
      }
    };

    const inputCls = "w-full h-[48px] rounded-xl border border-slate-200 bg-[#F8FAFC] px-4 text-[14px] outline-none transition focus:border-[#2563EB] focus:ring-4 focus:ring-[#2563EB]/10";

  function SubmissionsView({
    entries, loading, loadError, onReload,
    talukaFilter, setTalukaFilter,
    onOpenEntry, onExportEntry, onDeleteEntry, onExportCSV
  }) {
    const [search, setSearch] = useState("");
    const [sortBy, setSortBy] = useState("newest");

    const allSheetNames = Object.keys(TALUKA_SHEETS).map(k => TALUKA_SHEETS[k]);

    const counts = useMemo(() => {
      const c = {};
      allSheetNames.forEach(n => { c[n] = entries?.[n]?.length || 0; });
      return c;
    }, [entries]);

    const totalCount = useMemo(() => Object.values(counts).reduce((a, b) => a + b, 0), [counts]);

    const rows = useMemo(() => {
      if (!entries) return [];
      const targets = talukaFilter === "all" ? allSheetNames : [talukaFilter];
      const collected = [];
      targets.forEach(sheetName => {
        (entries[sheetName] || []).forEach(e => collected.push({ sheetName, ...e }));
      });
      let filtered = collected;
      if (search.trim()) {
        const q = search.trim().toLowerCase();
        filtered = collected.filter(r => {
          const d = r.data || {};
          return (
            (d["Full Name"] || "").toLowerCase().includes(q) ||
            (d["Father's Name"] || "").toLowerCase().includes(q) ||
            (d["CNIC Number"] || "").includes(q) ||
            (d["PID / Employee ID No."] || "").includes(q) ||
            (d["Taluka"] || "").toLowerCase().includes(q) ||
            (d["Mobile Number"] || "").includes(q)
          );
        });
      }
      if (sortBy === "newest") {
        filtered = [...filtered].sort((a, b) => {
          const ta = new Date(a.data["Submission Timestamp"] || 0).getTime() || 0;
          const tb = new Date(b.data["Submission Timestamp"] || 0).getTime() || 0;
          if (ta !== tb) return tb - ta;
          return b.rowIndex - a.rowIndex;
        });
      } else if (sortBy === "name") {
        filtered = [...filtered].sort((a, b) => (a.data["Full Name"] || "").localeCompare(b.data["Full Name"] || ""));
      } else if (sortBy === "bps") {
        filtered = [...filtered].sort((a, b) => (a.data["BPS Current"] || "").localeCompare(b.data["BPS Current"] || ""));
      }
      return filtered;
    }, [entries, talukaFilter, search, sortBy]);

    if (loading) {
      return html`
        <div className="py-20 text-center">
          <div className="w-12 h-12 mx-auto rounded-full border-4 border-slate-200 border-t-[#2563EB] animate-spin"></div>
          <div className="mt-4 text-[13px] text-slate-500">Loading submissions…</div>
        </div>

    if (loadError) {

            <div className="text-[14px] font-bold text-red-700">Could not load submissions</div>

            <button onClick=${onReload} className="mt-4 h-10 px-6 rounded-full bg-[#0F172A] text-white text-[12px] font-bold hover:bg-black">Retry</button>
          </div>
        </div>
      `;
    }

    return html`
      <div className="space-y-5">
        <!-- Filters -->

                ${search ? "Try a different search term." : "Nothing has been submitted yet for this filter."}

              <div className="overflow-x-auto">
                <table className="w-full text-left text-[12.5px]">
                  <thead className="bg-[#F8FAFC] border-b border-slate-200">
                    <tr className="text-slate-500 uppercase text-[10px] tracking-[0.1em]">
                      <th className="px-4 py-3 font-bold">#</th>
                      <th className="px-4 py-3 font-bold">Name</th>

                  <tbody>
                    ${rows.map((r, i) => {

                        <tr key=${`${r.sheetName}-${r.rowIndex}-${i}`} className="border-b border-slate-100 hover:bg-[#F8FAFC] transition">

  function SettingsView({
    scriptUrl, setScriptUrl, secret, setSecret,
    status, setStatus, scriptCode, onLogout
  }) {
    const [copied, setCopied] = useState(false);
    const [busy, setBusy] = useState("");

    const saveUrl = () => {
      try { localStorage.setItem("sba_script_url", scriptUrl); setStatus("✓ Web App URL saved."); }
      catch { setStatus("⚠ Could not save to localStorage."); }
    };

    const testConnection = async () => {
      if (!scriptUrl) { setStatus("Enter the Web App URL first."); return; }
      setBusy("test");
      setStatus("Testing connection...");
      try {
        const res = await fetch(scriptUrl, { method: "GET" });
        const data = await res.json();
        setStatus(`✓ Online — ${data.status} @ ${data.time}`);
      } catch (err) {
        setStatus(`✗ Connection failed: ${err.message}`);
      } finally { setBusy(""); }
    };

    const initSheets = async () => {
      if (!scriptUrl) { setStatus("Enter the Web App URL first."); return; }
      if (!secret) { setStatus("Enter the SETUP_SECRET first."); return; }
      setBusy("init");
      setStatus("Initializing taluka sheets...");
      try {
        const res = await fetch(scriptUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "setup", key: secret })
        });
        const data = await res.json();
        setStatus(data.ok ? `✓ ${data.message}` : `✗ ${data.error}`);
      } catch (err) {
        setStatus(`✗ ${err.message}`);
      } finally { setBusy(""); }
    };

    const copyScript = async () => {
      try { await navigator.clipboard.writeText(scriptCode); }
      catch {
        const ta = document.createElement("textarea");
        ta.value = scriptCode;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    };

    const inputCls = "w-full h-[46px] rounded-xl border border-slate-200 bg-white px-4 text-[13px] outline-none transition focus:border-[#2563EB] focus:ring-4 focus:ring-[#2563EB]/10";

    return html`
      <div className="space-y-5">
        <div className="bg-white rounded-2xl border border-slate-200 p-6 md:p-7 shadow-[0_1px_3px_0_rgba(15,23,42,0.06)]">
          <div className="text-[11px] font-bold tracking-widest text-slate-400 uppercase">Backend Configuration</div>
          <h2 className="mt-1 text-[20px] md:text-[24px] font-bold text-[#0F172A] tracking-tight">Google Sheets Integration</h2>
          <p className="text-[13px] text-slate-500 mt-1">Configure the connection to your Apps Script backend.</p>

          <div className="mt-6 grid lg:grid-cols-2 gap-5">
            <div className="space-y-4">
              <div>
                <label className="text-[11px] font-bold tracking-[0.08em] text-slate-700 uppercase">Web App URL</label>
                <div className="mt-2 flex gap-2">
                  <input
                    value=${scriptUrl}
                    onChange=${e => setScriptUrl(e.target.value)}
                    placeholder="https://script.google.com/macros/s/.../exec"
                    className=${`${inputCls} font-mono text-[12px] flex-1`}
                  />
                  <button onClick=${saveUrl} className="h-[46px] px-5 rounded-xl bg-[#0F172A] text-white text-[12px] font-bold hover:bg-black transition shrink-0">Save</button>
                </div>
              </div>

              <div>
                <label className="text-[11px] font-bold tracking-[0.08em] text-slate-700 uppercase">Setup Secret</label>
                <input
                  type="password"
                  value=${secret}
                  onChange=${e => setSecret(e.target.value)}
                  className=${`mt-2 ${inputCls} font-mono text-[12px]`}
                  placeholder="••••••••••••"
                />
                <div className="mt-1 text-[10px] text-slate-400">Change in Apps Script → Project Settings → Script Properties → SETUP_SECRET.</div>
              </div>

              <div className="flex flex-wrap gap-2">
                <button
                  onClick=${testConnection}
                  disabled=${busy === "test"}
                  className="h-[46px] px-5 rounded-xl bg-[#2563EB] text-white text-[12px] font-bold hover:bg-[#1d4ed8] transition disabled:opacity-70 flex items-center gap-2"
                >
                  ${busy === "test" ? html`<span className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>` : null}
                  Test Connection
                </button>
                <button
                  onClick=${initSheets}
                  disabled=${busy === "init"}
                  className="h-[46px] px-5 rounded-xl bg-[#10B981] text-white text-[12px] font-bold hover:bg-[#0ea76e] transition disabled:opacity-70 flex items-center gap-2"
                >
                  ${busy === "init" ? html`<span className="w-3.5 h-3.5 border-2 border-white/30 border-t-white rounded-full animate-spin"></span>` : null}
                  Initialize Sheets
                </button>
                <button
                  onClick=${onLogout}
                  className="h-[46px] px-5 rounded-xl bg-red-50 text-red-600 text-[12px] font-bold hover:bg-red-100 transition"
                >Sign Out</button>
              </div>

              <div className="rounded-xl border border-slate-200 bg-[#F8FAFC] p-4 text-[12px] text-slate-700 min-h-[52px]">
                ${status || "Status: Ready"}
              </div>

              <div className="rounded-2xl border border-slate-200 bg-[#F8FAFC] p-5">
                <div className="text-[12px] font-bold text-[#0F172A]">Notes</div>
                <ul className="mt-3 space-y-2 text-[12px] leading-relaxed text-slate-600 list-disc list-inside">
                  <li><strong>Initialize Sheets</strong> is non-destructive — it creates missing sheets and refreshes the header row, but never deletes data.</li>
                  <li>After updating Apps Script code, always redeploy: Deploy → Manage Deployments → ✏ → New Version.</li>
                  <li>Keep the <span className="font-mono">SETUP_SECRET</span> private.</li>
                </ul>
              </div>
            </div>

            <div>
              <div className="flex items-center justify-between">
                <div className="text-[11px] font-bold tracking-[0.08em] text-slate-700 uppercase">Apps Script Code</div>
                <button
                  onClick=${copyScript}
                  className="h-8 px-3 rounded-full bg-[#0F172A] text-white text-[11px] font-semibold hover:bg-black transition"
                >${copied ? "Copied!" : "Copy Code"}</button>
              </div>
              <pre className="mt-2 bg-[#0F172A] text-[#E2E8F0] rounded-2xl p-4 text-[11px] leading-[1.5] font-mono whitespace-pre-wrap overflow-auto max-h-[460px]">
${scriptCode}
              </pre>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  /* Full Apps Script — kept as a constant for the Settings tab */
  const APPS_SCRIPT_CODE = (() => {

      "Nawabshah":  "Responses_Nawabshah",
      "Sakrand":    "Responses_Sakrand",
      "Kazi Ahmed": "Responses_KaziAhmed",
      "Others":     "Responses_Others"
    }, null, 2);

    const HEADERS_LITERAL = JSON.stringify(SHEET_HEADERS, null, 2);

    return `/* ============================================================
   PST Seniority — District Shaheed Benazir Abad
   Backend for public form + admin dashboard.
   ============================================================ */
const SHEET_MAP = ${SHEET_MAP_LITERAL};
const DEFAULT_SHEET = "Responses_Others";
const HEADERS = ${HEADERS_LITERAL};

function json(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

function getSetupSecret() {
  return PropertiesService.getScriptProperties().getProperty("SETUP_SECRET") || "";
}

function sanitizeCell(v) {
  if (v === null || v === undefined) return "";
  var s = String(v);
  if (/^[=+@\\t\\r-]/.test(s)) return "'" + s;
  return s;
}

function sheetNameFor(taluka) {
  return SHEET_MAP[taluka] || DEFAULT_SHEET;
}

function styleHeader(sheet) {
  var hr = sheet.getRange(1, 1, 1, HEADERS.length);
  hr.setValues([HEADERS]);
  hr.setBackground("#0F172A").setFontColor("#FFFFFF").setFontWeight("bold").setWrap(true);
  sheet.setFrozenRows(1);
  try { sheet.autoResizeColumns(1, HEADERS.length); } catch(e) {}
  hr.setHorizontalAlignment("center");
}

function ensureSheetStructure(name) {
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(name);
  var created = false;
  if (!sheet) {
    sheet = ss.insertSheet(name);
    created = true;
  }
  styleHeader(sheet);
  return { name: name, created: created, rows: Math.max(0, sheet.getLastRow() - 1) };
}

function doPost(e) {
  var lock = LockService.getScriptLock();
  try {
    if (!lock.tryLock(10000)) {
      return json({ok:false, error:"Server busy, please retry in a moment."});
    }
    var body = {};
    try { body = JSON.parse(e.postData.contents); } catch(err) { body = e.parameter; }
    var action = body.action || e.parameter.action;
    var key = body.key || e.parameter.key || "";

    /* -------- VERIFY (login) -------- */
    if (action === "verify") {
      var exp0 = getSetupSecret();
      return json({ok: !!exp0 && key === exp0});
    }

    /* -------- SETUP (non-destructive) -------- */
    if (action === "setup") {
      var expected = getSetupSecret();
      if (!expected) return json({ok:false, error:"SETUP_SECRET not configured."});
      if (key !== expected) return json({ok:false, error:"Invalid setup secret"});
      var names = Object.keys(SHEET_MAP).map(function(k) { return SHEET_MAP[k]; });
      var results = names.map(function(n) { return ensureSheetStructure(n); });
      results.push(ensureSheetStructure(DEFAULT_SHEET));
      var summary = results.map(function(r) {
        return (r.created ? "＋" : "•") + " " + r.name + " (" + r.rows + " rows)";
      }).join(" | ");
      return json({ok:true, message:"Sheets ready — " + summary});
    }

    /* -------- LIST (dashboard) -------- */
    if (action === "list") {
      var exp2 = getSetupSecret();
      if (!exp2 || key !== exp2) return json({ok:false, error:"Unauthorized"});
      var ss2 = SpreadsheetApp.getActiveSpreadsheet();
      var payload = {};
      var allSheets = Object.keys(SHEET_MAP).map(function(k) { return SHEET_MAP[k]; });
      allSheets.push(DEFAULT_SHEET);
      for (var s = 0; s < allSheets.length; s++) {
        var nm = allSheets[s];
        var sheet = ss2.getSheetByName(nm);
        if (!sheet) { payload[nm] = []; continue; }
        var last = sheet.getLastRow();
        if (last < 2) { payload[nm] = []; continue; }
        var values = sheet.getRange(2, 1, last - 1, HEADERS.length).getValues();
        payload[nm] = values.map(function(row, idx) {
          var obj = { rowIndex: idx + 2, data: {} };
          for (var j = 0; j < HEADERS.length; j++) {
            var v = row[j];
            if (v instanceof Date) {
              v = Utilities.formatDate(v, "Asia/Karachi", "yyyy-MM-dd");
            }
            obj.data[HEADERS[j]] = (v === null || v === undefined) ? "" : String(v);
          }
          return obj;
        });
      }
      return json({ok:true, sheets: payload, headers: HEADERS});
    }

    /* -------- UPDATE (dashboard edit) -------- */
    if (action === "update") {
      var exp3 = getSetupSecret();
      if (!exp3 || key !== exp3) return json({ok:false, error:"Unauthorized"});
      var targetSheetName = body.sheet;
      var rowIndex = parseInt(body.rowIndex, 10);
      var data = body.data || {};
      if (!targetSheetName || !rowIndex || rowIndex < 2) return json({ok:false, error:"Invalid sheet or row"});
      var ss3 = SpreadsheetApp.getActiveSpreadsheet();
      var target = ss3.getSheetByName(targetSheetName);
      if (!target) return json({ok:false, error:"Sheet not found: " + targetSheetName});
      if (rowIndex > target.getLastRow()) return json({ok:false, error:"Row out of range"});
      var rowVals = HEADERS.map(function(h) { return sanitizeCell(data[h] || ""); });
      target.getRange(rowIndex, 1, 1, HEADERS.length).setValues([rowVals]);
      return json({ok:true, message:"Row #" + rowIndex + " updated in " + targetSheetName});
    }

    /* -------- DELETE -------- */
    if (action === "delete") {
      var exp4 = getSetupSecret();
      if (!exp4 || key !== exp4) return json({ok:false, error:"Unauthorized"});
      var delSheetName = body.sheet;
      var delIndex = parseInt(body.rowIndex, 10);
      if (!delSheetName || !delIndex || delIndex < 2) return json({ok:false, error:"Invalid sheet or row"});
      var ss4 = SpreadsheetApp.getActiveSpreadsheet();
      var delSheet = ss4.getSheetByName(delSheetName);
      if (!delSheet) return json({ok:false, error:"Sheet not found"});
      if (delIndex > delSheet.getLastRow()) return json({ok:false, error:"Row out of range"});
      delSheet.deleteRow(delIndex);
      return json({ok:true, message:"Row deleted"});
    }

    /* -------- SUBMIT (public form) -------- */
    if (action === "submit") {
      var data2 = body.data || {};
      var taluka = data2["Taluka"] || "";
      var targetName = sheetNameFor(taluka);
      ensureSheetStructure(targetName);
      var ssS = SpreadsheetApp.getActiveSpreadsheet();
      var sheetS = ssS.getSheetByName(targetName);

      var required = HEADERS.filter(function(h) {
        return h !== "Submission Timestamp"
            && h !== "Date of Regularization"
            && h.indexOf("Manual") === -1
            && h !== "Remarks";
      });
      for (var r = 0; r < required.length; r++) {
        if (!data2[required[r]]) return json({ok:false, error:"Missing required field: " + required[r]});
      }

      var cnicRaw = String(data2["CNIC Number"] || "").replace(/[^0-9]/g, "");
      var cache = CacheService.getScriptCache();
      var dedupKey = "sub_" + targetName + "_" + cnicRaw;
      if (cnicRaw && cache.get(dedupKey)) {
        return json({ok:false, error:"Duplicate submission detected for this CNIC in the " + taluka + " taluka. Please wait 60 seconds."});
      }
      var rlKey = "rl_" + Math.floor(Date.now() / 60000);
      var count = parseInt(cache.get(rlKey) || "0", 10);
      if (count >= 120) return json({ok:false, error:"Too many submissions. Please try again shortly."});

      var rowS = HEADERS.map(function(h) {
        if (h === "Submission Timestamp") {
          return new Date().toLocaleString("en-PK", {timeZone: "Asia/Karachi"});
        }
        return sanitizeCell(data2[h] || "");
      });
      sheetS.appendRow(rowS);

      if (cnicRaw) cache.put(dedupKey, "1", 60);
      cache.put(rlKey, String(count + 1), 120);

      return json({ok:true, id: Utilities.getUuid().slice(0,8).toUpperCase(), sheet: targetName, message:"Recorded"});
    }

    return json({ok:false, error:"Unknown action"});
  } catch(err) {
    return json({ok:false, error: err.toString()});
  } finally {
    try { lock.releaseLock(); } catch(e) {}
  }
}

function doGet(e) {
  return json({status:"online", time: new Date().toISOString()});
}`;
  })();

  function AdminApp() {
    const { secret, authed, login, logout } = useSession();
    const [scriptUrl, setScriptUrl] = useState("");
    const [loginError, setLoginError] = useState("");
    const [sidebarOpen, setSidebarOpen] = useState(false);
    const [view, setView] = useState("overview");

    const [entries, setEntries] = useState(null);
    const [loading, setLoading] = useState(true);
    const [loadError, setLoadError] = useState(null);
    const [refreshing, setRefreshing] = useState(false);

    const [talukaFilter, setTalukaFilter] = useState("all");
    const [openEntry, setOpenEntry] = useState(null);
    const [pendingDelete, setPendingDelete] = useState(null);
    const [deleting, setDeleting] = useState(false);
    const [toasts, setToasts] = useState([]);
    const [settingsStatus, setSettingsStatus] = useState("");

    /* Toast helper */
    const pushToast = (message, type = "success") => {
      const id = Math.random().toString(36).slice(2, 8);
      setToasts(t => [...t, { id, message, type }]);
      setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3800);
    };
    const dismissToast = id => setToasts(t => t.filter(x => x.id !== id));

    /* Load stored script URL */
    useEffect(() => {
      try {
        const saved = localStorage.getItem("sba_script_url");
        if (saved) setScriptUrl(saved);
      } catch {}
    }, []);

    /* Fetch entries when authed + url + secret ready */
    const fetchEntries = async (isRefresh) => {
      if (!scriptUrl || !secret) return;
      if (isRefresh) setRefreshing(true); else setLoading(true);
      setLoadError(null);
      try {
        const res = await fetch(scriptUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "list", key: secret })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Failed to load submissions");
        setEntries(data.sheets || {});
      } catch (err) {
        setLoadError(err.message || "Failed to load submissions");
        if (isRefresh) pushToast(err.message || "Failed to refresh", "error");
      } finally {
        setLoading(false);
        setRefreshing(false);
      }
    };

    useEffect(() => {
      if (authed && scriptUrl && secret) {
        fetchEntries(false);
      }
      // eslint-disable-next-line
    }, [authed, scriptUrl, secret]);

    const counts = useMemo(() => {
      const c = {};
      Object.keys(TALUKA_SHEETS).forEach(t => {
        c[TALUKA_SHEETS[t]] = entries?.[TALUKA_SHEETS[t]]?.length || 0;
      });
      return c;
    }, [entries]);

    const totalCount = useMemo(() => Object.values(counts).reduce((a, b) => a + b, 0), [counts]);

    /* Delete flow */
    const requestDelete = (entry) => setPendingDelete(entry);
    const cancelDelete = () => { if (!deleting) setPendingDelete(null); };

    const confirmDelete = async () => {
      if (!pendingDelete) return;
      setDeleting(true);
      try {
        const res = await fetch(scriptUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "delete",
            key: secret,
            sheet: pendingDelete.sheet,
            rowIndex: pendingDelete.rowIndex
          })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Delete failed");
        pushToast("Entry deleted.", "success");
        setPendingDelete(null);
        setOpenEntry(null);
        setEntries(null);
        fetchEntries(true);
      } catch (err) {
        pushToast(err.message || "Delete failed", "error");
      } finally {
        setDeleting(false);
      }
    };

    /* CSV export */
    const exportCSV = (rows) => {
      if (!rows || rows.length === 0) { pushToast("No rows to export.", "error"); return; }
      const headers = SHEET_HEADERS.filter(h => h !== "Submission Timestamp").concat(["Submission Timestamp"]);
      const escape = v => {
        const s = String(v == null ? "" : v);
        return '"' + s.replace(/"/g, '""') + '"';
      };
      const lines = [headers.map(escape).join(",")];
      rows.forEach(r => {
        const d = r.data || {};
        lines.push(headers.map(h => escape(d[h] || "")).join(","));
      });
      const blob = new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `pst-seniority-export-${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      pushToast(`Exported ${rows.length} record${rows.length === 1 ? "" : "s"}.`, "success");
    };

    /* Auth gate */
    if (!authed) {
      return html`
        <${LoginScreen}
          scriptUrl=${scriptUrl}
          setScriptUrl=${setScriptUrl}
          onLogin=${login}
          error=${loginError}
          setError=${setLoginError}
        />
      `;
    }

    /* Header title/subtitle based on view */
    const titles = {
      overview:    { t: "Overview",        s: "Dashboard" },
      submissions: { t: "Submissions",     s: "Records" },
      talukas:     { t: "Taluka Views",    s: "Breakdown" },
      settings:    { t: "Settings",        s: "Configuration" }
    };

    return html`
      <div className="min-h-screen bg-[#F8FAFC] text-[#0F172A] overflow-x-hidden">
        <${Sidebar}
          open=${sidebarOpen}
          onClose=${() => setSidebarOpen(false)}
          active=${view}
          onNavigate=${setView}
          onLogout=${() => { logout(); setEntries(null); }}
        />

        <div className="lg:ml-64 min-h-screen flex flex-col">
          <${Topbar}
            title=${titles[view].t}
            subtitle=${titles[view].s}
            onMenuToggle=${() => setSidebarOpen(v => !v)}
            onRefresh=${() => fetchEntries(true)}
            refreshing=${refreshing}
            onExportAll=${view === "submissions" ? null : null}
          />

          <main className="flex-1 px-4 md:px-6 py-6">
            ${view === "overview" && html`
              <${OverviewView}
                entries=${entries}
                loading=${loading}
                counts=${counts}
                totalCount=${totalCount}
                onNavigate=${setView}
                onEditEntry=${setOpenEntry}
              />
            `}
            ${view === "submissions" && html`
              <${SubmissionsView}
                entries=${entries}
                loading=${loading}
                loadError=${loadError}
                onReload=${() => fetchEntries(true)}
                talukaFilter=${talukaFilter}
                setTalukaFilter=${setTalukaFilter}
                onOpenEntry=${setOpenEntry}
                onExportEntry=${exportEntryPdf}
                onDeleteEntry=${requestDelete}
                onExportCSV=${exportCSV}
              />
            `}
            ${view === "talukas" && html`
              <${TalukasView} entries=${entries} onNavigate=${setView} />
            `}
            ${view === "settings" && html`
              <${SettingsView}
                scriptUrl=${scriptUrl}
                setScriptUrl=${setScriptUrl}
                secret=${secret}
                setSecret=${() => {}}
                status=${settingsStatus}
                setStatus=${setSettingsStatus}
                scriptCode=${APPS_SCRIPT_CODE}
                onLogout=${() => { logout(); setEntries(null); }}
              />
            `}
          </main>

          <footer className="px-6 py-4 border-t border-slate-200 text-[11px] text-slate-400 flex items-center justify-between">
            <span>PST Seniority Admin — District Shaheed Benazir Abad</span>
            <span>© ${new Date().getFullYear()} District Education Office</span>
          </footer>
        </div>

        ${openEntry && html`
          <${EntryDetailModal}
            entry=${openEntry}
            scriptUrl=${scriptUrl}
            secret=${secret}
            onClose=${() => setOpenEntry(null)}
            onSaved=${() => { setEntries(null); fetchEntries(true); }}
            onDelete=${requestDelete}
            onExport=${exportEntryPdf}
            pushToast=${pushToast}
          />
        `}

        <${ConfirmDialog}
          open=${!!pendingDelete}
          title="Delete this record?"
          message=${pendingDelete
            ? `This will permanently remove the row for "${pendingDelete.data["Full Name"] || "Unnamed"}" from ${pendingDelete.sheet}. This cannot be undone.`
            : ""}
          confirmLabel="Delete Permanently"
          danger=${true}
          onConfirm=${confirmDelete}
          onCancel=${cancelDelete}
          busy=${deleting}
        />

        <${ToastStack} toasts=${toasts} onDismiss=${dismissToast} />
      </div>
    `;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(
    html`<${React.StrictMode}><${AdminApp} /><//>`
  );
  </script>
</body>
</html>
