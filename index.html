  /* ============================================================
     TECH SUPPORT CONTACT — scoped under .tsx-* namespace
     Never collides with Tailwind or existing styles.
     ============================================================ */

  /* ---------- Top strip ---------- */
  .tsx-strip {
    position: relative;
    z-index: 20;
    background: linear-gradient(90deg, #0F172A 0%, #1e293b 50%, #0F172A 100%);
    color: #fff;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .tsx-strip-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: clamp(10px, 1.4vw, 14px) clamp(16px, 3vw, 32px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .tsx-strip-text {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(11.5px, 1.3vw, 13px);
    color: rgba(255,255,255,0.85);
    line-height: 1.4;
    min-width: 0;
  }
  .tsx-strip-text strong { color: #fff; font-weight: 700; }
  .tsx-strip-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: rgba(37,99,235,0.25);
    color: #60A5FA;
    font-size: 12px;
    flex-shrink: 0;
  }
  .tsx-strip-btn {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 16px;
    border-radius: 999px;
    background: #fff;
    color: #0F172A;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.01em;
    border: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    transition: transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s;
    flex-shrink: 0;
    white-space: nowrap;
    font-family: inherit;
  }
  .tsx-strip-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 24px -10px rgba(37,99,235,0.6);
  }
  .tsx-strip-btn::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(37,99,235,0.15), transparent);
    transform: translateX(-100%);
    transition: transform .6s;
    pointer-events: none;
  }
  .tsx-strip-btn:hover::after { transform: translateX(100%); }
  .tsx-strip-btn-arrow { display: inline-block; transition: transform .25s; }
  .tsx-strip-btn:hover .tsx-strip-btn-arrow { transform: translateX(3px); }

  /* ---------- Footer strip ---------- */
  .tsx-footer-wrap {
    background: linear-gradient(135deg, #0F172A 0%, #1e293b 100%);
    border-top: 1px solid rgba(255,255,255,0.05);
    border-bottom: 1px solid rgba(255,255,255,0.05);
    padding: clamp(20px, 3vw, 28px) clamp(16px, 3vw, 32px);
    position: relative;
    overflow: hidden;
  }
  .tsx-footer-wrap::before {
    content: "";
    position: absolute;
    top: -50%;
    right: -10%;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(37,99,235,0.15), transparent 70%);
    pointer-events: none;
  }
  .tsx-footer-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: relative;
  }
  .tsx-footer-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2563EB, #06B6D4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 8px 20px -8px rgba(37,99,235,0.5);
    color: #fff;
  }
  .tsx-footer-content { flex: 1; min-width: 220px; }
  .tsx-footer-content h4 {
    font-size: clamp(13px, 1.4vw, 15px);
    font-weight: 700;
    color: #fff;
    margin: 0;
    letter-spacing: -0.01em;
    font-family: inherit;
  }
  .tsx-footer-content p {
    font-size: clamp(11.5px, 1.2vw, 12.5px);
    color: rgba(255,255,255,0.55);
    margin: 4px 0 0;
    line-height: 1.5;
  }
  .tsx-footer-btn {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 40px;
    padding: 0 20px;
    border-radius: 999px;
    background: linear-gradient(135deg, #2563EB, #06B6D4);
    color: #fff;
    font-size: 12.5px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s;
    white-space: nowrap;
    flex-shrink: 0;
    font-family: inherit;
  }
  .tsx-footer-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px -10px rgba(37,99,235,0.6);
  }
  .tsx-footer-btn::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: translateX(-100%);
    transition: transform .6s;
    pointer-events: none;
  }
  .tsx-footer-btn:hover::after { transform: translateX(100%); }

  /* ---------- Modal ---------- */
  @keyframes tsxFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes tsxScaleIn {
    from { opacity: 0; transform: translateY(24px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
  }
  @keyframes tsxPulseRing {
    0%   { transform: scale(0.95); opacity: 0.7; }
    70%  { transform: scale(1.18); opacity: 0; }
    100% { transform: scale(1.18); opacity: 0; }
  }
  @keyframes tsxGlow {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 0.7; }
  }
  @keyframes tsxPulseDot {
    0%   { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); }
    70%  { box-shadow: 0 0 0 8px rgba(16,185,129,0); }
    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }
  @keyframes tsxSpin { to { transform: rotate(360deg); } }

  .tsx-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 3vw, 24px);
    background: rgba(15, 23, 42, 0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    animation: tsxFadeIn .32s cubic-bezier(.16,1,.3,1) both;
    overflow-y: auto;
  }
  .tsx-modal {
    position: relative;
    width: 100%;
    max-width: 560px;
    margin: auto;
    max-height: calc(100vh - clamp(24px, 6vw, 48px));
    background: #fff;
    border-radius: clamp(20px, 3vw, 28px);
    overflow: hidden;
    box-shadow:
      0 32px 80px -24px rgba(15,23,42,0.5),
      0 0 0 1px rgba(255,255,255,0.05);
    animation: tsxScaleIn .48s cubic-bezier(.16,1,.3,1) both;
    display: flex;
    flex-direction: column;
    font-family: inherit;
  }

  /* Header band */
  .tsx-header {
    position: relative;
    flex-shrink: 0;
    padding: clamp(18px, 3vw, 24px) clamp(20px, 3.5vw, 28px);
    background: linear-gradient(135deg, #2563EB 0%, #0F172A 135%);
    color: #fff;
    overflow: hidden;
    min-height: 108px;
  }
  .tsx-header-glow {
    position: absolute;
    top: -60%;
    right: -25%;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(6,182,212,0.55), transparent 70%);
    animation: tsxGlow 4s ease-in-out infinite;
    pointer-events: none;
  }
  .tsx-header::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.08) 1px, transparent 0);
    background-size: 22px 22px;
    opacity: 0.5;
    pointer-events: none;
  }
  .tsx-header-label {
    position: relative;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
  }
  .tsx-header-sub {
    position: relative;
    font-size: 13px;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
    margin-top: 4px;
  }
  .tsx-close-btn {
    position: absolute;
    top: clamp(14px, 2vw, 18px);
    right: clamp(14px, 2vw, 18px);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.22);
    color: #fff;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform .3s cubic-bezier(.16,1,.3,1), background .2s;
    z-index: 3;
    font-family: inherit;
  }
  .tsx-close-btn:hover {
    background: rgba(255,255,255,0.25);
    transform: rotate(90deg);
  }

  /* Body */
  .tsx-body {
    flex: 1;
    overflow-y: auto;
    padding: 0 clamp(20px, 3.5vw, 32px) max(24px, env(safe-area-inset-bottom));
    background: #fff;
  }

  /* Avatar */
  .tsx-avatar-wrap {
    position: relative;
    display: inline-block;
    margin-top: clamp(20px, 5vw, 40px);
    margin-bottom: 14px;
  }
  .tsx-avatar-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(37,99,235,0.55);
    animation: tsxPulseRing 2.6s cubic-bezier(0,0,0.2,1) infinite;
    pointer-events: none;
  }
  .tsx-avatar {
    position: relative;
    z-index: 2;
    width: clamp(88px, 22vw, 108px);
    height: clamp(88px, 22vw, 108px);
    border-radius: 50%;
    border: 4px solid #fff;
    object-fit: cover;
    display: block;
    background: #F8FAFC;
    box-shadow: 0 12px 32px -12px rgba(15,23,42,0.4);
  }
  .tsx-avatar-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2563EB, #0F172A);
    color: #fff;
    font-size: clamp(28px, 6vw, 36px);
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  /* Identity */
  .tsx-identity { margin-bottom: 12px; }
  .tsx-name {
    font-size: clamp(20px, 4.2vw, 24px);
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #0F172A;
    margin: 0;
    line-height: 1.15;
    font-family: inherit;
  }
  .tsx-role {
    display: inline-block;
    margin-top: 8px;
    padding: 4px 12px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(37,99,235,0.12), rgba(6,182,212,0.12));
    border: 1px solid rgba(37,99,235,0.2);
    color: #2563EB;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .tsx-bio {
    margin: 0 0 18px;
    font-size: 13.5px;
    line-height: 1.65;
    color: #475569;
  }

  /* Info row */
  .tsx-info-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 12px;
    background: #F8FAFC;
    border: 1px solid #E2E8F0;
    font-size: 12.5px;
    color: #475569;
    font-weight: 500;
    margin-bottom: 18px;
  }
  .tsx-info-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10B981;
    flex-shrink: 0;
    animation: tsxPulseDot 2s infinite;
  }

  /* Contact grid */
  .tsx-contact-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  @media (min-width: 480px) {
    .tsx-contact-grid { grid-template-columns: 1fr 1fr; }
    .tsx-card-email { grid-column: 1 / -1; }
  }

  .tsx-contact-card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 16px;
    background: #fff;
    border: 1px solid #E2E8F0;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    transition: transform .28s cubic-bezier(.16,1,.3,1), box-shadow .28s, border-color .28s;
    cursor: pointer;
  }
  .tsx-contact-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(37,99,235,0.06), transparent);
    transform: translateX(-100%);
    transition: transform .7s;
    pointer-events: none;
  }
  .tsx-contact-card:hover {
    transform: translateY(-2px);
    border-color: #CBD5E1;
    box-shadow: 0 14px 32px -16px rgba(15,23,42,0.25);
  }
  .tsx-contact-card:hover::before { transform: translateX(100%); }

  .tsx-contact-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
    color: #fff;
    transition: transform .28s cubic-bezier(.16,1,.3,1);
  }
  .tsx-contact-card:hover .tsx-contact-icon { transform: scale(1.08) rotate(-4deg); }
  .tsx-icon-email    { background: linear-gradient(135deg, #2563EB, #1d4ed8); }
  .tsx-icon-phone    { background: linear-gradient(135deg, #0F172A, #334155); }
  .tsx-icon-whatsapp { background: linear-gradient(135deg, #10B981, #059669); }

  .tsx-contact-body { min-width: 0; flex: 1; }
  .tsx-contact-label {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #94A3B8;
    margin-bottom: 2px;
  }
  .tsx-contact-value {
    font-size: 13.5px;
    font-weight: 600;
    color: #0F172A;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tsx-card-email .tsx-contact-value,
  .tsx-card-phone .tsx-contact-value,
  .tsx-card-whatsapp .tsx-contact-value { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }

  .tsx-contact-arrow {
    font-size: 14px;
    color: #CBD5E1;
    transition: transform .28s, color .28s;
    flex-shrink: 0;
  }
  .tsx-contact-card:hover .tsx-contact-arrow {
    transform: translateX(4px);
    color: #2563EB;
  }

  /* Response indicator */
  .tsx-responder {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(16,185,129,0.08), rgba(6,182,212,0.06));
    border: 1px solid rgba(16,185,129,0.2);
    font-size: 12px;
    font-weight: 600;
    color: #047857;
    margin-bottom: 20px;
  }
  .tsx-responder-pulse {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10B981;
    animation: tsxPulseDot 2s infinite;
    flex-shrink: 0;
  }

  /* Actions */
  .tsx-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding-top: 4px;
  }
  .tsx-btn {
    height: 44px;
    padding: 0 24px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s, background .2s;
    font-family: inherit;
  }
  .tsx-btn-primary {
    background: #0F172A;
    color: #fff;
  }
  .tsx-btn-primary:hover {
    background: #000;
    transform: translateY(-1px);
    box-shadow: 0 12px 28px -12px rgba(15,23,42,0.5);
  }

  /* Mobile tightening */
  @media (max-width: 420px) {
    .tsx-strip-inner { justify-content: center; text-align: center; }
    .tsx-strip-text  { justify-content: center; }
    .tsx-footer-inner { flex-direction: column; align-items: flex-start; }
    .tsx-footer-btn  { width: 100%; justify-content: center; }
    .tsx-actions     { flex-direction: column-reverse; }
    .tsx-btn         { width: 100%; justify-content: center; display: inline-flex; align-items: center; }
  }

/* ============================================================
   PTA Member Modal — scoped under .ptam-* namespace
   ============================================================ */

@keyframes ptam-overlay-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}
@keyframes ptam-modal-in {
  from { opacity: 0; transform: translateY(28px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0)    scale(1); }
}
@keyframes ptam-pulse-ring {
  0%   { transform: scale(1);    opacity: 0.55; }
  100% { transform: scale(1.35); opacity: 0;    }
}
@keyframes ptam-glow {
  0%, 100% { opacity: 0.3; }
  50%      { opacity: 0.6; }
}

/* ---------- Overlay ---------- */
.ptam-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  animation: ptam-overlay-in 0.3s ease both;
  overflow-y: auto;
  font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

/* ---------- Modal card ---------- */
.ptam-modal {
  position: relative;
  width: 100%;
  max-width: 640px;
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px);
  margin: auto;
  display: flex;
  flex-direction: column;
  background: #fff;
  border-radius: 24px;
  overflow: hidden;
  box-shadow:
    0 32px 80px -24px rgba(0, 0, 0, 0.5),
    0 0 0 1px rgba(255, 255, 255, 0.06);
  animation: ptam-modal-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
}

/* ---------- Header ---------- */
.ptam-header {
  position: relative;
  flex-shrink: 0;
  padding: 20px 24px 24px;
  color: #fff;
  overflow: hidden;
  isolation: isolate;
}

.ptam-header-bg {
  position: absolute;
  inset: 0;
  z-index: -3;
}

.ptam-header-glow {
  position: absolute;
  top: -50%;
  right: -20%;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.28), transparent 70%);
  animation: ptam-glow 5s ease-in-out infinite;
  pointer-events: none;
  z-index: -2;
}

.ptam-header-pattern {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.12) 1px, transparent 0);
  background-size: 20px 20px;
  opacity: 0.55;
  pointer-events: none;
  z-index: -1;
}

.ptam-header-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}

.ptam-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.72);
  padding-top: 9px;
}

.ptam-close {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.22);
  color: #fff;
  font-size: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s;
  flex-shrink: 0;
  font-family: inherit;
  line-height: 1;
  padding: 0;
}

.ptam-close:hover {
  background: rgba(255, 255, 255, 0.28);
  transform: rotate(90deg);
}

/* ---------- Profile row (inside header) ---------- */
.ptam-profile {
  display: flex;
  align-items: center;
  gap: 18px;
}

.ptam-avatar-wrap {
  position: relative;
  flex-shrink: 0;
}

.ptam-avatar-ring {
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.4);
  animation: ptam-pulse-ring 2.6s cubic-bezier(0, 0, 0.2, 1) infinite;
  pointer-events: none;
}

.ptam-avatar {
  position: relative;
  width: 84px;
  height: 84px;
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.92);
  background: rgba(255, 255, 255, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  box-shadow: 0 10px 24px -8px rgba(0, 0, 0, 0.4);
}

.ptam-avatar-initials {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.02em;
}

.ptam-avatar-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.ptam-identity {
  flex: 1;
  min-width: 0;
}

.ptam-role {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.18);
  border: 1px solid rgba(255, 255, 255, 0.25);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #fff;
  margin-bottom: 8px;
}

.ptam-name {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.18;
  color: #fff;
  margin: 0;
  word-break: break-word;
}

.ptam-name.ptam-pending {
  font-style: italic;
  color: rgba(255, 255, 255, 0.6);
}

.ptam-subtitle {
  margin-top: 5px;
  font-size: 12px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.75);
  display: flex;
  align-items: center;
  gap: 6px;
  word-break: break-word;
}

.ptam-subtitle-dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.55);
  flex-shrink: 0;
}

/* ---------- Body ---------- */
.ptam-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 24px 24px;
  background: #fff;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #CBD5E1 transparent;
}

.ptam-body::-webkit-scrollbar { width: 8px; }
.ptam-body::-webkit-scrollbar-thumb {
  background: #CBD5E1;
  border-radius: 999px;
  border: 2px solid #fff;
}
.ptam-body::-webkit-scrollbar-track { background: transparent; }

/* ---------- Sections ---------- */
.ptam-section {
  margin-bottom: 22px;
}

.ptam-section-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.ptam-section-head-text {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: #94A3B8;
  white-space: nowrap;
}

.ptam-section-head-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, #E2E8F0, transparent);
}

/* ---------- Bio ---------- */
.ptam-bio {
  font-size: 13.5px;
  line-height: 1.7;
  color: #475569;
  margin: 0;
  white-space: pre-wrap;
  word-break: break-word;
}

/* ---------- Contact grid ---------- */
.ptam-contact-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}

.ptam-contact-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid #E2E8F0;
  background: #F8FAFC;
  text-decoration: none;
  color: inherit;
  overflow: hidden;
  transition:
    transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
    box-shadow 0.3s,
    border-color 0.3s,
    background 0.3s;
  cursor: pointer;
  min-width: 0;
}

.ptam-contact-card::after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 55%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
  transform: skewX(-20deg);
  transition: left 0.75s ease;
  pointer-events: none;
}

.ptam-contact-card:hover {
  transform: translateY(-2px);
  border-color: #CBD5E1;
  background: #fff;
  box-shadow: 0 12px 28px -14px rgba(15, 23, 42, 0.22);
}

.ptam-contact-card:hover::after {
  left: 140%;
}

.ptam-contact-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: #fff;
  flex-shrink: 0;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.35);
}

.ptam-contact-card:hover .ptam-contact-icon {
  transform: scale(1.08) rotate(-3deg);
}

.ptam-icon-email { background: linear-gradient(135deg, #2563EB, #1D4ED8); }
.ptam-icon-phone { background: linear-gradient(135deg, #0F172A, #334155); }
.ptam-icon-wa    { background: linear-gradient(135deg, #10B981, #059669); }

.ptam-contact-info {
  min-width: 0;
  flex: 1;
}

.ptam-contact-label {
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #94A3B8;
  margin-bottom: 3px;
}

.ptam-contact-value {
  font-size: 13px;
  font-weight: 600;
  color: #0F172A;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ptam-contact-value.ptam-mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  letter-spacing: -0.01em;
}

.ptam-contact-arrow {
  flex-shrink: 0;
  color: #CBD5E1;
  font-size: 14px;
  transition: transform 0.3s, color 0.3s;
}

.ptam-contact-card:hover .ptam-contact-arrow {
  transform: translateX(4px);
  color: #2563EB;
}

/* ---------- Info box (empty contact state) ---------- */
.ptam-info-box {
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px dashed #CBD5E1;
  background: #F8FAFC;
  text-align: center;
  font-size: 12px;
  color: #64748B;
}

/* ---------- Text card (address) ---------- */
.ptam-text-card {
  padding: 14px 16px;
  border-radius: 14px;
  border: 1px solid #E2E8F0;
  background: #F8FAFC;
  font-size: 13px;
  line-height: 1.65;

    const d = String(raw).replace(/\D/g, "").slice(0, 13);

    if (d.length <= 12) return `${d.slice(0, 5)}-${d.slice(5)}`;

      if (!form.dob) e.dob = "Date of birth is required";
      else if (new Date(form.dob) > new Date()) e.dob = "Cannot be a future date";

    form, setForm, errors, setErrors, step, setStep,
    touched, setTouched, shake, isSubmitting, submitError,
    onSubmit, onRetry, scrollRef
  }) {
    const progress = useMemo(() => (step / 5) * 100, [step]);

    const update = (key, value) => {
      let v = value;
      if (key === "fullName" || key === "fatherName") v = String(v).toUpperCase();
      if (key === "cnic") v = formatCNIC(v);
      if (key === "mobile" || key === "whatsapp") v = formatPhone(v);
      setForm(prev => ({ ...prev, [key]: v }));
      if (touched[key]) setErrors(prev => { const n = { ...prev }; delete n[key]; return n; });
    };

    const markTouched = key => setTouched(prev => ({ ...prev, [key]: true }));

    const goNext = () => {
      const errs = validateStep(step, form);
      if (Object.keys(errs).length) { setErrors(errs); return; }
      if (step < 5) {
        setStep(step + 1);
        window.scrollTo({ top: scrollRef.current?.offsetTop ? scrollRef.current.offsetTop - 120 : 0, behavior: "smooth" });
      }
    };

    const goBack = () => { if (step > 1) setStep(step - 1); };

    const inputCls = (err, base = "bg-white") =>
      `input-focus w-full h-[48px] rounded-xl border px-4 text-[14px] outline-none transition-all ${base} ${err ? "border-red-300 bg-red-50/40" : "border-slate-200"}`;
    const selectCls = err =>

    const talukaAccent = (() => {
      const match = PTA_DATA.talukas.find(t => t.name === form.taluka);
      return match ? match.accent : "#2563EB";
    })();

    return html`

        <div className="tsx-strip-inner">
          <div className="tsx-strip-text">
            <span className="tsx-strip-icon">⚠</span>
            <span><strong>For Any Technical Issue or Data Correction:</strong> Please Contact</span>
          </div>
          <button className="tsx-strip-btn" onClick=${onOpen} type="button">
            Contact Technical Team
            <span className="tsx-strip-btn-arrow">→</span>
          </button>
        </div>
      </div>
    `;
  }

  function SupportFooterStrip({ onOpen }) {
    return html`
      <div className="tsx-footer-wrap">
        <div className="tsx-footer-inner">
          <div className="tsx-footer-icon">🛠</div>
          <div className="tsx-footer-content">
            <h4>For Any Technical Issue or Data Correction</h4>
            <p>Reach out to our technical support team for assistance with your submission.</p>
          </div>
          <button className="tsx-footer-btn" onClick=${onOpen} type="button">
            Contact Support
            <span className="tsx-strip-btn-arrow">→</span>
          </button>
        </div>
      </div>
    `;
  }

  function SupportModal({ open, onClose, data }) {
    useEffect(() => {
      if (!open) return;
      const onKey = e => { if (e.key === "Escape") onClose(); };
      document.addEventListener("keydown", onKey);
      document.body.style.overflow = "hidden";
      return () => {
        document.removeEventListener("keydown", onKey);
        document.body.style.overflow = "";
      };
    }, [open, onClose]);

    if (!open) return null;

    const telHref = data.mobile ? `tel:${data.mobile.replace(/\D/g, "")}` : null;
    const waHref = data.whatsapp
      ? `https://wa.me/92${data.whatsapp.replace(/\D/g, "").replace(/^0/, "")}`
      : null;
    const gmailHref = data.email
      ? `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(data.email)}&su=${encodeURIComponent("PST Seniority Portal — Support Request")}`
      : null;
    const initials = (() => {
      if (!data.name) return "TS";
      const p = data.name.trim().split(/\s+/);
      return p.length === 1 ? p[0][0] : p[0][0] + p[p.length - 1][0];
    })();

    return html`
      <div className="tsx-overlay" onClick=${e => { if (e.target === e.currentTarget) onClose(); }}>
        <div className="tsx-modal" role="dialog" aria-modal="true" aria-label="Technical Support Contact">

          <div className="tsx-header">
            <div className="tsx-header-glow"></div>
            <button className="tsx-close-btn" onClick=${onClose} type="button" aria-label="Close">✕</button>
            <div className="tsx-header-label">TECHNICAL SUPPORT</div>
            <div className="tsx-header-sub">Official Contact</div>
          </div>

          <div className="tsx-body">

            <div className="tsx-avatar-wrap">
              <div className="tsx-avatar-ring"></div>
              ${data.picture
                ? html`
                    <img
                      className="tsx-avatar"
                      src=${data.picture}
                      alt=${data.name}
                      onError=${e => {
                        const el = e.currentTarget;
                        el.outerHTML = `<div class="tsx-avatar tsx-avatar-fallback"><span>${initials}</span></div>`;
                      }}
                    />
                  `
                : html`<div className="tsx-avatar tsx-avatar-fallback"><span>${initials}</span></div>`}
            </div>

            <div className="tsx-identity">
              <h2 className="tsx-name">${data.name}</h2>
              <span className="tsx-role">${data.role}</span>
            </div>

            ${data.bio && html`<p className="tsx-bio">${data.bio}</p>`}

            ${data.hours && html`
              <div className="tsx-info-row">
                <span className="tsx-info-dot"></span>
                <span>${data.hours}</span>
              </div>
            `}

            <div className="tsx-contact-grid">
              ${gmailHref && html`
                <a className="tsx-contact-card tsx-card-email" href=${gmailHref} target="_blank" rel="noopener noreferrer">
                  <div className="tsx-contact-icon tsx-icon-email">✉</div>
                  <div className="tsx-contact-body">
                    <div className="tsx-contact-label">Email (opens Gmail)</div>
                    <div className="tsx-contact-value">${data.email}</div>
                  </div>
                  <div className="tsx-contact-arrow">→</div>
                </a>
              `}
              ${telHref && html`
                <a className="tsx-contact-card tsx-card-phone" href=${telHref}>
                  <div className="tsx-contact-icon tsx-icon-phone">☏</div>
                  <div className="tsx-contact-body">
                    <div className="tsx-contact-label">Mobile</div>
                    <div className="tsx-contact-value">${data.mobile}</div>
                  </div>
                  <div className="tsx-contact-arrow">→</div>
                </a>
              `}
              ${waHref && html`
                <a className="tsx-contact-card tsx-card-whatsapp" href=${waHref} target="_blank" rel="noopener noreferrer">
                  <div className="tsx-contact-icon tsx-icon-whatsapp">✆</div>
                  <div className="tsx-contact-body">
                    <div className="tsx-contact-label">WhatsApp</div>
                    <div className="tsx-contact-value">${data.whatsapp}</div>
                  </div>
                  <div className="tsx-contact-arrow">→</div>
                </a>
              `}
            </div>

            ${data.responseTime && html`
              <div className="tsx-responder">
                <span className="tsx-responder-pulse"></span>
                ${data.responseTime}
              </div>
            `}

            <div className="tsx-actions">
              <button className="tsx-btn tsx-btn-primary" onClick=${onClose} type="button">Close</button>
            </div>

          </div>
        </div>
      </div>
    `;
  }

  function FAQSection() {
    const faqs = [
      { q: "Who should fill this form?", a: "All Primary School Teachers (PST) currently serving in District Shaheed Benazir Abad across its four talukas — Daur, Nawabshah, Sakrand, and Kazi Ahmed." },
      { q: "What is the purpose of this portal?", a: "To compile a verified, authoritative PST Seniority List for promotion purposes. Records are filed under each teacher's taluka." },
      { q: "Is Date of Regularization mandatory?", a: "No. It is the only optional field and is marked with an OPTIONAL badge." },
      { q: "Why must names be in CAPITAL LETTERS?", a: "To ensure uniformity across government records and to match CNIC registration data." },
      { q: "Where does my submission go?", a: "It is automatically saved to the separate record maintained for the taluka you select in Step 2." },
      { q: "What if I made an error in my submission?", a: "Contact the District Education Office. Authorized staff can correct your entry from the administrative dashboard." }
    ];
    return html`
      <section className="reveal max-w-[1200px] mx-auto px-4 md:px-8 py-14 md:py-20">
        <div className="flex items-center gap-3">
          <div className="w-8 h-8 rounded-full bg-[#0F172A] text-white flex items-center justify-center text-[12px] font-bold">?</div>
          <h3 className="text-[22px] font-bold tracking-tight text-[#0F172A]">Frequently asked questions</h3>
        </div>

        <div className="mt-6 grid md:grid-cols-2 gap-4">
          ${faqs.map((f, i) => html`
            <details key=${i} className="group bg-white rounded-2xl border border-slate-200 p-5 open:shadow-[0_10px_30px_-18px_rgba(15,23,42,0.2)] transition">
              <summary className="list-none flex items-center justify-between cursor-pointer">
                <span className="font-semibold text-[14px] text-[#0F172A]">${f.q}</span>
                <span className="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center group-open:rotate-45 transition">+</span>
              </summary>
              <p className="mt-3 text-[13px] leading-relaxed text-slate-600">${f.a}</p>
            </details>
          `)}
        </div>
      </section>
    `;
  }

  function Footer({ onNav }) {
    return html`
      <footer className="bg-[#0F172A] text-white/70 border-t border-white/5">
        <div className="max-w-[1200px] mx-auto px-4 md:px-8 py-10 grid md:grid-cols-[1.2fr_0.6fr_0.6fr] gap-8">
          <div>
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-xl bg-white text-[#0F172A] flex items-center justify-center font-bold">P</div>
              <div className="font-bold text-white tracking-tight">PST Seniority Portal — SBA</div>
            </div>
            <p className="mt-4 text-[13px] leading-relaxed max-w-[420px]">
              Official data collection portal for the PST Seniority List of District Shaheed Benazir Abad.
              Operated in coordination with the District Education Office and the Primary Teachers Association (PTA).
            </p>
            <div className="mt-5 flex gap-2 text-[11px] flex-wrap">
              <span className="px-3 py-1 rounded-full bg-white/5 border border-white/10">TLS Protected</span>
              <span className="px-3 py-1 rounded-full bg-white/5 border border-white/10">Govt Verified</span>
              <span className="px-3 py-1 rounded-full bg-white/5 border border-white/10">Promotion 2026</span>
            </div>
          </div>
          <div>
            <div className="text-[11px] font-bold tracking-widest text-white/40">NAVIGATION</div>
            <div className="mt-4 space-y-2 text-[13px]">
              ${[["home","Home"],["pta","PTA Team"],["about","About"],["guidelines","Guidelines"],["form","Submit Data"]].map(([id, label]) => html`
                <button key=${id} onClick=${() => onNav(id)} className="block hover:text-white transition text-left">${label}</button>
              `)}
            </div>
          </div>
          <div>
            <div className="text-[11px] font-bold tracking-widest text-white/40">DISTRICT</div>
            <div className="mt-4 space-y-2 text-[13px]">
              <div>Shaheed Benazir Abad</div>
              <div className="text-white/50">Talukas: Daur • Nawabshah • Sakrand • Kazi Ahmed</div>
              <div className="pt-3">© ${new Date().getFullYear()} District Education Office</div>
              <a href="admin.html" className="inline-flex items-center gap-1 mt-2 text-white/40 hover:text-white transition text-[11px]">
                Staff Access <span>→</span>
              </a>
            </div>
          </div>
        </div>
        <div className="border-t border-white/5">
          <div className="max-w-[1200px] mx-auto px-4 md:px-8 h-[56px] flex items-center justify-center md:justify-between text-[11px]">
            <span>Official portal — Department of Education, Government of Sindh</span>
            <span className="hidden md:block">PST Seniority List 2026</span>
          </div>
        </div>
      </footer>
    `;
  }

  function BottomNav({ active, onNav }) {
    const items = [
      { id: "home",       icon: "⌂", label: "Home" },
      { id: "pta",        icon: "◉", label: "PTA" },
      { id: "form",       icon: "✦", label: "Form" },
      { id: "guidelines", icon: "≡", label: "Guide" },
      { id: "security",   icon: "◈", label: "Privacy" }
    ];
    return html`
      <div className="fixed bottom-3 left-1/2 -translate-x-1/2 z-30 glass rounded-full shadow-[0_16px_40px_-12px_rgba(15,23,42,0.35)] border border-slate-200/60 px-2 py-2 flex items-center gap-1">
        ${items.map(it => html`
          <button
            key=${it.id}
            onClick=${() => onNav(it.id)}
            className=${`h-10 min-w-[52px] px-2 md:px-3 rounded-full flex flex-col items-center justify-center text-[10px] font-semibold transition ${
              active === it.id ? "bg-[#0F172A] text-white" : "text-slate-500 hover:text-[#0F172A] hover:bg-slate-100"
            }`}
          >
            <span className="text-[14px] leading-none">${it.icon}</span>
            <span className="mt-0.5 tracking-wide">${it.label}</span>
          </button>
        `)}
      </div>
    `;
  }

  /* ---------- Main App ---------- */

  function App() {
    const [scriptUrl, setScriptUrl] = useState("");
    const [activeSection, setActiveSection] = useState("home");

    const [step, setStep] = useState(1);
    const [form, setForm] = useState(EMPTY_FORM);
    const [errors, setErrors] = useState({});
    const [touched, setTouched] = useState({});
    const [isSubmitting, setIsSubmitting] = useState(false);
    const [submitError, setSubmitError] = useState(null);
    const [shake, setShake] = useState(false);
    const [success, setSuccess] = useState(null);

    const [memberModal, setMemberModal] = useState({ open: false, member: null, context: null });
    const [supportOpen, setSupportOpen] = useState(false);

    const formRef = useRef(null);

    /* Redirect ?admin=1 to admin.html */
    useEffect(() => {
      const url = (window.location.href || "").toLowerCase();
      if (url.includes("admin=1") || url.includes("?admin") || url.includes("&admin")) {
        window.location.replace("admin.html");
      }
    }, []);

    /* Load stored script URL */
    useEffect(() => {
      try {
        const saved = localStorage.getItem("sba_script_url");
        if (saved) setScriptUrl(saved);
      } catch {}
    }, []);

    useEffect(() => {
      try {
        const raw = sessionStorage.getItem("sba_form_draft");
        if (raw) setForm(JSON.parse(raw));
      } catch {}
    }, []);

    useEffect(() => {
      try { sessionStorage.setItem("sba_form_draft", JSON.stringify(form)); } catch {}
    }, [form]);

    useEffect(() => {
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("revealed");
            const id = entry.target.getAttribute("id");
            if (id) setActiveSection(id);
          }
        });
      }, { threshold: 0.15 });
      document.querySelectorAll(".reveal").forEach(el => observer.observe(el));
      return () => observer.disconnect();
    }, [success]);

    const navigate = id => {
      setActiveSection(id);
      const el = document.getElementById(id);
      if (!el) return;
      el.scrollIntoView({ behavior: "smooth", block: "start" });
      el.classList.add("ring-2", "ring-[#2563EB]/30");
      setTimeout(() => el.classList.remove("ring-2", "ring-[#2563EB]/30"), 800);
    };

    const openMemberModal = (member, context) => setMemberModal({ open: true, member, context });
    const closeMemberModal = () => setMemberModal({ open: false, member: null, context: null });

    const handleSubmit = async () => {
      const stepErrors = validateStep(5, form);
      if (Object.keys(stepErrors).length) { setErrors(stepErrors); triggerShake(); return; }
      if (!scriptUrl) {
        setSubmitError("Backend connection is not configured. Please contact the district IT cell.");
        return;
      }
      setIsSubmitting(true);
      setSubmitError(null);
      try {
        const payload = buildPayload(form);
        const res = await fetch(scriptUrl, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "submit", data: payload })
        });
        if (!res.ok) throw new Error(`Server responded with HTTP ${res.status}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "The server rejected this submission.");
        setSuccess({ id: data.id, taluka: form.taluka, sheet: data.sheet });
        try { sessionStorage.removeItem("sba_form_draft"); } catch {}
      } catch (err) {
        setSubmitError(err.message || "An unexpected error occurred.");
      } finally {
        setIsSubmitting(false);
      }
    };

    const triggerShake = () => { setShake(true); setTimeout(() => setShake(false), 500); };
      const resetForm = () => {
      setSuccess(null);
      setForm(EMPTY_FORM);
      setStep(1);
      try { sessionStorage.removeItem("sba_form_draft"); } catch {}
      setTimeout(() => window.scrollTo(0, 0), 0);
    };

      if (success) {
      return html`
        <${SuccessScreen}
          id=${success.id}
          taluka=${success.taluka}
          sheet=${success.sheet}
          onNew=${resetForm}
          onDone=${resetForm}
        />
      `;
    }

    return html`
      <div className="min-h-screen bg-[#F8FAFC] text-[#0F172A] selection:bg-[#2563EB]/20 overflow-x-hidden">
        <style>
${`
        *{font-family:Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif}
        .reveal{opacity:0; transform:translateY(18px); transition: all 0.7s cubic-bezier(0.16,1,0.3,1)}
        .reveal.revealed{opacity:1; transform:translateY(0)}
        .glass{backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); background: rgba(255,255,255,0.82); border: 1px solid rgba(15,23,42,0.06)}
        .input-focus:focus{transform:translateY(-1px); box-shadow:0 8px 24px -10px rgba(37,99,235,0.35), 0 0 0 4px rgba(37,99,235,0.12); border-color:#2563EB}
        .shake{animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both}
        @keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes slideDown{from{opacity:0;transform:translateY(-8px);max-height:0}to{opacity:1;transform:translateY(0);max-height:200px}}
        .shine{position:relative; overflow:hidden}
        .shine:after{content:""; position:absolute; top:0; left:-100%; width:60%; height:100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent); transform:skewX(-20deg); transition:left 0.6s}
        .shine:hover:after{left:140%}
        ::-webkit-scrollbar{width:8px; height:8px}
        ::-webkit-scrollbar-thumb{background:#CBD5E1; border-radius:999px}
        ::-webkit-scrollbar-track{background:transparent}
`}
        </style>

        <${TopNav} active=${activeSection} onNav=${navigate} />

        <${SupportStrip} onOpen=${() => setSupportOpen(true)} />

        <${Hero}
          onStartForm=${() => navigate("form")}
          onViewGuidelines=${() => navigate("guidelines")}
        />

        <${PTASection} onViewMember=${openMemberModal} />

        <${AboutSection} />

        <${GuidelinesSection} />

        <${FormSection}
          form=${form}
          setForm=${setForm}
          errors=${errors}
          setErrors=${setErrors}
          step=${step}
          setStep=${setStep}
          touched=${touched}
          setTouched=${setTouched}
          shake=${shake}
          isSubmitting=${isSubmitting}
          submitError=${submitError}
          onSubmit=${handleSubmit}
          onRetry=${handleSubmit}
          scrollRef=${formRef}
        />

        <${SecuritySection} />

        <${FAQSection} />

        <${SupportFooterStrip} onOpen=${() => setSupportOpen(true)} />

        <${Footer} onNav=${navigate} />

        <${BottomNav} active=${activeSection} onNav=${navigate} />

        <div className="pb-32" aria-hidden="true"></div>

          ${memberModal.open && html`
          <${PtaMemberModal}
            member=${memberModal.member}
            context=${memberModal.context}
            onClose=${closeMemberModal}
          />
        `}

        <${SupportModal}
          open=${supportOpen}
          onClose=${() => setSupportOpen(false)}
          data=${SUPPORT_DATA}
        />
      </div>
    `;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(
    html`<${React.StrictMode}><${App} /><//>`
  );
  </script>
</body>
</html>
